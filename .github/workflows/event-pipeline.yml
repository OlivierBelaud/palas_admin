name: Event pipeline safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palas
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: palas_costs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U palas -d palas_costs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PALAS_TEST_DATABASE_URL: postgresql://palas:test-only@127.0.0.1:5432/palas_costs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vitest run demo/commerce/tests demo/commerce/src/commands/admin/__tests__/sync-posthog-events-visitor-session.test.ts
